; ║  SmartRail OS — ESP32 Passenger Counter & Hardware Diagnostics           ║
; ╚══════════════════════════════════════════════════════════════════════════╝

[platformio]
default_envs = esp32dev

[env]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 115200

; ── Production Environment: Directional Passenger Counter ────────────────────
[env:esp32dev]
build_src_filter = +<main.cpp>

; ── Hardware Diagnostic Environment: Raw Sensor Test & Pin Verification ──────
[env:test_hardware]
build_src_filter = +<test_hardware.cpp>
